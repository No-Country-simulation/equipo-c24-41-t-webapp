<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow position-relative">
        <button 
          type="button" 
          class="btn-close position-absolute top-0 end-0 m-2" 
          aria-label="Close" 
          (click)="goHome()">
        </button>

        <div class="card-body">
          <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
              <button 
                class="nav-link" 
                [class.active]="isLogin" 
                (click)="toggleMode(true)">
                Iniciar Sesión
              </button>
            </li>
            <li class="nav-item">
              <button 
                class="nav-link" 
                [class.active]="!isLogin" 
                (click)="toggleMode(false)">
                Registro
              </button>
            </li>
          </ul>

          <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input 
                id="email" 
                formControlName="email" 
                type="email" 
                class="form-control" 
                [class.is-invalid]="authForm.get('email')?.invalid && (authForm.get('email')?.touched || authForm.get('email')?.dirty)"
                placeholder="tuemail@ejemplo.com">
              <div *ngIf="authForm.get('email')?.invalid && (authForm.get('email')?.touched || authForm.get('email')?.dirty)" 
                   class="invalid-feedback">
                <div *ngIf="authForm.get('email')?.errors?.['required']">Email es requerido</div>
                <div *ngIf="authForm.get('email')?.errors?.['email']">Formato de email inválido</div>
              </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input 
                id="password" 
                formControlName="password" 
                type="password" 
                class="form-control" 
                [class.is-invalid]="authForm.get('password')?.invalid && (authForm.get('password')?.touched || authForm.get('password')?.dirty)"
                placeholder="Contraseña">
              <div *ngIf="authForm.get('password')?.invalid && (authForm.get('password')?.touched || authForm.get('password')?.dirty)" 
                   class="invalid-feedback">
                Contraseña es requerida
              </div>
            </div>

            <!-- Campos de Registro -->
            <ng-container *ngIf="!isLogin">
              <!-- Nombre -->
              <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input 
                  id="name" 
                  formControlName="name" 
                  type="text" 
                  class="form-control" 
                  [class.is-invalid]="authForm.get('name')?.invalid && (authForm.get('name')?.touched || authForm.get('name')?.dirty)"
                  placeholder="Tu nombre">
                <div *ngIf="authForm.get('name')?.invalid && (authForm.get('name')?.touched || authForm.get('name')?.dirty)" 
                     class="invalid-feedback">
                  Nombre es requerido
                </div>
              </div>

              <!-- Confirmar Contraseña -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                <input 
                  id="confirmPassword" 
                  formControlName="confirmPassword" 
                  type="password" 
                  class="form-control" 
                  [class.is-invalid]="authForm.get('confirmPassword')?.invalid || authForm.hasError('mismatch')"
                  placeholder="Confirmar contraseña">
                <div class="invalid-feedback">
                  <div *ngIf="authForm.get('confirmPassword')?.errors?.['required']">
                    Confirmación de contraseña es requerida
                  </div>
                  <div *ngIf="authForm.hasError('mismatch') && !authForm.get('confirmPassword')?.errors?.['required']">
                    Las contraseñas no coinciden
                  </div>
                </div>
              </div>

              <!-- Rol -->
              <div class="mb-3">
                <label for="role" class="form-label">Rol</label>
                <select 
                  id="role" 
                  formControlName="role" 
                  class="form-select" 
                  (change)="onRoleChange($event)">
                  <option value="cliente">Cliente</option>
                  <option value="vendedor">Vendedor</option>
                </select>
              </div>

              <!-- Nombre del Negocio -->
              <ng-container *ngIf="authForm.get('role')?.value === 'vendedor'">
                <div class="mb-3">
                  <label for="businessName" class="form-label">Nombre del Negocio</label>
                  <input 
                    id="businessName" 
                    formControlName="businessName" 
                    type="text" 
                    class="form-control" 
                    [class.is-invalid]="authForm.get('businessName')?.invalid && (authForm.get('businessName')?.touched || authForm.get('businessName')?.dirty)"
                    placeholder="Nombre de tu negocio">
                  <div *ngIf="authForm.get('businessName')?.invalid && (authForm.get('businessName')?.touched || authForm.get('businessName')?.dirty)" 
                       class="invalid-feedback">
                    Nombre del negocio es requerido
                  </div>
                </div>
              </ng-container>
            </ng-container>

            <!-- Mensaje General -->
            <div *ngIf="authForm.invalid && (authForm.touched || authForm.dirty)" class="alert alert-danger mt-3">
              Por favor completa todos los campos requeridos correctamente
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">
              {{ isLogin ? 'Iniciar Sesión' : 'Registrarse' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
