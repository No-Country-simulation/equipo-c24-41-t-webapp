<!-- Encabezado de la página -->
<header class="bg-light border-bottom">
    <div class="container-fluid d-flex justify-content-between align-items-center py-2">
        <!-- Logo y título -->
        <div class="d-flex align-items-center">
            <img alt="logo" class="me-2" height="40"
                src="https://storage.googleapis.com/a1aa/image/yF0YTb2ArxKVuXgemuk3i3DhHBhaapWIooQY5q90BjU.jpg"
                width="40" />
            <span class="h5 mb-0">TITULO</span>
        </div>

        <!-- Barra de búsqueda y botones de acción -->
        <div class="d-flex align-items-center">
            <div class="input-group me-3">
                <input class="form-control" placeholder="Busca Cerámica" type="text" />
                <span class="input-group-text">
                    <i class="fa-sharp-duotone fa-solid fa-magnifying-glass"></i> <!-- Ícono de lupa -->

            </div>
            <button class="btn btn-outline-primary me-2">Regístrate o inicia sesión</button>

        </div>
