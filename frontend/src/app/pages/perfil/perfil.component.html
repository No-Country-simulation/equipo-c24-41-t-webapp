<app-header>
  <div class="d-flex gap-3">
    <app-sell-button></app-sell-button>
    <app-home-button></app-home-button>
  </div>
</app-header>



<app-category></app-category>

<main class="container my-4">
  <h2 class="text-center">Perfil de {{ rol | titlecase }}</h2>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body">
          <ng-container [ngSwitch]="rol">
            <!-- Perfil de Cliente -->
            <div *ngSwitchCase="'cliente'">
              <h3 class="text-primary">Perfil de Cliente</h3>
              <ul class="list-group list-group-flush">
                <li class="list-group-item">
                  <strong>Nombre:</strong> {{ cliente?.nombre }} {{ cliente?.apellido }}
                </li>
                <li class="list-group-item">
                  <strong>Email:</strong> {{ cliente?.email }}
                </li>
              </ul>
            </div>

            <!-- Perfil de Vendedor -->
            <div *ngSwitchCase="'vendedor'">
              <h3 class="text-success">Perfil de Vendedor</h3>
              <ul class="list-group list-group-flush">
                <li class="list-group-item">
                  <strong>Nombre del Negocio:</strong> {{ vendedor?.negocio }}
                </li>
                <li class="list-group-item">
                  <strong>Email:</strong> {{ vendedor?.email }}
                </li>
              </ul>
            </div>
 
            <!-- Caso no reconocido -->
            <div *ngSwitchDefault>
              <h3 class="text-danger">ERROR</h3>
              <p>Por favor, inicia sesion y verifica tu cuenta.</p>
            </div>
            
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
