<div class="position-relative">
    <i class="bi bi-cart fs-3 text-secondary ms-auto me-3 d-flex align-items-center" (click)="toggleCart()"></i>
    <span class="position-absolute top-0 start-0 translate-middle badge rounded-pill bg-danger" 
          *ngIf="cart().length">
      {{ cart().length }}
    </span>
  
  </div>
  
  <div class="offcanvas offcanvas-end show" tabindex="-1" *ngIf="isOpen">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Carrito de Compras</h5>
      <button type="button" class="btn-close" (click)="toggleCart()"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="list-group" *ngIf="cart().length; else emptyCart">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let product of cart(); let i = index">
          {{ product.name }} - ${{ product.price }}
          <span class="badge bg-primary rounded-pill">{{ product.quantity }}</span>
          <button class="btn btn-sm btn-danger" (click)="remove(i)">X</button>
        </li>
      </ul>
      <ng-template #emptyCart>
        <p class="text-muted">El carrito está vacío.</p>
      </ng-template>
    </div>
  </div>
