<div class="container my-5">
    <h1 class="text-center mb-4">Sube tu anuncio</h1>

    <!-- Sección de Categorías (opcional) -->
    <div class="bg-light p-4 rounded shadow-sm mb-4">
        <h2 class="text-center mb-3">¿Qué subirás?</h2>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 text-center">
            <!-- Tus botones de categorías existentes -->
            <!-- ... -->
        </div>
    </div>

    <!-- Formulario de Publicación -->
    <div class="bg-light p-4 rounded shadow-sm">
        <form *ngIf="formVisible" (ngSubmit)="onSubmit()" [formGroup]="productForm">
            <div class="row g-3">
                <!-- Nombre -->
                <div class="col-md-6">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" class="form-control" formControlName="nombre" placeholder="Ej: Collar de plata">
                </div>

                <!-- Precio -->
                <div class="col-md-6">
                    <label class="form-label">Precio (USD)</label>
                    <input type="number" class="form-control" formControlName="precio" placeholder="Ej: 50">
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" formControlName="descripcion" rows="3"
                        placeholder="Describe tu producto..."></textarea>
                </div>

                <!-- Imagen -->
                <div class="col-12 mb-4">
                    <label class="form-label fw-bold">Imagen del Producto</label>

                    <!-- Opción 1: Subir desde el dispositivo -->
                    <div *ngIf="!useImageUrl" class="card border-0 shadow-sm p-3">
                        <div class="mb-3">
                            <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
                            <small class="form-text text-muted">Sube una imagen en formato JPG, PNG o JPEG.</small>
                        </div>
                        <button type="button" class="btn btn-outline-primary w-100" (click)="toggleImageInput()">
                            <i class="bi bi-link-45deg me-2"></i> ¿Prefieres usar una URL? Haz clic aquí.
                        </button>
                    </div>

                    <!-- Opción 2: Usar una URL -->
                    <div *ngIf="useImageUrl" class="card border-0 shadow-sm p-3">
                        <div class="mb-3">
                            <input type="url" class="form-control" formControlName="imagen"
                                placeholder="Ej: https://mis-imagenes.com/collar.jpg">
                            <small class="form-text text-muted">Ingresa la URL de una imagen.</small>
                        </div>
                        <button type="button" class="btn btn-outline-primary w-100" (click)="toggleImageInput()">
                            <i class="bi bi-upload me-2"></i> ¿Prefieres subir una imagen? Haz clic aquí.
                        </button>
                    </div>

                    <!-- Vista previa de la imagen -->
                    <div *ngIf="imagePreview" class="mt-4 text-center">
                        <div class="card border-0 shadow-sm p-3">
                            <h6 class="fw-bold mb-3">Vista previa de la imagen</h6>
                            <div class="d-flex justify-content-center">
                                <div style="width: 150px; height: 150px; overflow: hidden;" class="rounded">
                                    <img [src]="imagePreview" alt="Vista previa de la imagen"
                                        class="img-fluid h-100 w-100 object-fit-cover">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Categoría -->
                <div class="col-md-6">
                    <label class="form-label">Categoría</label>
                    <select class="form-select" formControlName="categoria">
                        <option value="">Seleccione una categoría</option>
                        <option value="Cerámica">Cerámica</option>
                        <option value="Madera">Madera</option>
                        <option value="Pintura y Arte">Pintura y Arte</option>
                        <option value="Joyería">Joyería</option>
                        <option value="Cosméticos Naturales">Cosméticos Naturales</option>
                        <option value="Accesorios para el Hogar">Accesorios para el Hogar</option>
                        <option value="Productos Ecológicos">Productos Ecológicos</option>
                        <option value="Alimentos Artesanales">Alimentos Artesanales</option>
                    </select>
                </div>

                <!-- Stock -->
                <div class="col-md-6">
                    <label class="form-label">Stock disponible</label>
                    <input type="number" class="form-control" formControlName="stock" min="0" placeholder="Ej: 10">
                </div>

                <!-- Ubicación -->
                <div class="col-md-6">
                    <label class="form-label">Ubicación</label>
                    <input type="text" class="form-control" formControlName="ubicacion" placeholder="Ej: Lima, Perú">
                </div>

                <!-- Especificaciones -->
                <div class="col-12">
                    <label class="form-label">Especificaciones técnicas</label>
                    <textarea class="form-control" formControlName="especificaciones" rows="2"
                        placeholder="Detalles técnicos importantes..."></textarea>
                </div>

                <!-- Botones -->
                <div class="col-12 text-end">
                    <button type="button" class="btn btn-outline-danger me-2" (click)="toggleForm()">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="!productForm.valid">
                        Publicar Producto
                    </button>
                </div>
            </div>
        </form>

        <!-- Botón para mostrar el formulario -->
        <button *ngIf="!formVisible" (click)="toggleForm()" class="btn btn-success w-100">
            <i class="bi bi-plus-circle me-2"></i>
            Crear Nuevo Anuncio
        </button>
    </div>
</div>
