<!-- Contenedor principal -->
<div class="container my-5">
    <!-- Título principal -->
    <h1 class="text-center mb-4">Sube tu anuncio</h1>

    <!-- Contenedor de categorías -->
    <div class="bg-light p-4 rounded shadow-sm">
        <!-- Título  -->
        <h2 class="text-center mb-3">¿Qué subirás?</h2>

        <!-- Fila de botones | categorías -->
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 text-center">
            <!--  Joyería -->
            <div class="col">
                <button class="btn btn-outline-primary w-100 p-3 d-flex flex-column align-items-center">
                    <img src="https://placehold.co/50x50" alt="Icon representing items you no longer need" class="mb-2">
                    <span>Joyería</span>
                </button>
            </div>

            <!--  Pintura y Arte -->
            <div class="col">
                <button class="btn btn-outline-primary w-100 p-3 d-flex flex-column align-items-center">
                    <img src="https://placehold.co/50x50" alt="Icon representing employment" class="mb-2">
                    <span>Pintura y Arte</span>
                </button>
            </div>

            <!--  Accesorios para el hogar -->
            <div class="col">
                <button class="btn btn-outline-primary w-100 p-3 d-flex flex-column align-items-center">
                    <img src="https://placehold.co/50x50" alt="Icon representing services" class="mb-2">
                    <span>Accesorios para el hogar</span>
                </button>
            </div>

            <!--  Productos ecológicos -->
            <div class="col">
                <button class="btn btn-outline-primary w-100 p-3 d-flex flex-column align-items-center">
                    <img src="https://placehold.co/50x50" alt="Icon representing a vehicle" class="mb-2">
                    <span>Productos ecológicos</span>
                </button>
            </div>

            <!--  Alimentos Artesanales -->
            <div class="col">
                <button class="btn btn-outline-primary w-100 p-3 d-flex flex-column align-items-center">
                    <img src="https://placehold.co/50x50" alt="Icon representing a property" class="mb-2">
                    <span>Alimentos Artesanales</span>
                </button>
            </div>
        </div>
    </div>
</div>
