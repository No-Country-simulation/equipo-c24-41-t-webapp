<div class="row">
  <div class="col-md-4" *ngFor="let product of products">
    <div class="card mb-3">
      <img *ngIf="product.imagen" [src]="product.imagen" class="card-img-top" alt="{{ product.nombre }}">
      <div class="card-body">
        <h5 class="card-title">{{ product.nombre }}</h5>
        <p class="card-text">{{ product.descripcion }}</p>
        <p class="card-text"><strong>${{ product.precio }}</strong></p>
        <button (click)="onAgregar(product)" class="btn btn-primary">Agregar al carrito</button>
        <button (click)="onToggleFav(product)"
        [ngClass]="{'btn-danger': isFavorite(product), 'btn-outline-secondary': !isFavorite(product)}"
        class="btn ms-2">
        <i [ngClass]="{'bi-heart-fill': isFavorite(product), 'bi-heart': !isFavorite(product)}"></i>
        Favoritos
      </button>
      
      
      </div>
    </div>
  </div>
</div>
