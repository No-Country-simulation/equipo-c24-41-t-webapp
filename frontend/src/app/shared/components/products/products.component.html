<div class="container mt-4">
    <div class="row">
      <div class="col-md-4" *ngFor="let product of products">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">${{ product.price }}</p>
            <button class="btn btn-primary" (click)="addToCart(product)">
              Agregar al carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
